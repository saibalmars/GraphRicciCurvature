name: Documentation

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/docs.yml'
      - 'GraphRicciCurvature/**'
      - 'doc/**'
      - 'notebooks/**'
      - 'README.md'
      - 'setup.py'
  pull_request:
    paths:
      - '.github/workflows/docs.yml'
      - 'GraphRicciCurvature/**'
      - 'doc/**'
      - 'notebooks/**'
      - 'README.md'
      - 'setup.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: doc/requirements.readthedocs.txt
      - name: Install documentation dependencies
        run: python -m pip install -r doc/requirements.readthedocs.txt
      - name: Install Pandoc
        uses: pandoc/actions/setup@v1
      - name: Build documentation
        run: python -m sphinx -b html -W --keep-going doc/source doc/_build/html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: doc/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
