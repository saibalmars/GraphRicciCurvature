name: Publish package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          tag_version = tag[1:]
          version_pattern = r"[0-9]+\.[0-9]+\.[0-9]+(?:[.-][0-9A-Za-z.-]+)?"
          if not re.fullmatch(f"v{version_pattern}", tag):
              raise SystemExit(f"Release tag must be a version tag like v0.5.4: {tag}")

          init_text = Path("GraphRicciCurvature/__init__.py").read_text()
          init_version = re.search(r'__version__\s*=\s*[\'\"]([^\'\"]+)', init_text).group(1)

          if init_version != tag_version:
              raise SystemExit(f"Version mismatch: tag={tag_version}, package={init_version}")
          print(f"Publishing GraphRicciCurvature {tag_version}")
          PY

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/GraphRicciCurvature
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          name: python-package
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
