name: Publish package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build distributions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install --upgrade pip build
          python - <<'PY'
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          version_pattern = r"[0-9]+\.[0-9]+\.[0-9]+(?:[.-][0-9A-Za-z.-]+)?"
          if not re.fullmatch(f"v{version_pattern}", tag):
              raise SystemExit(f"Release tag must be a version tag like v0.5.4: {tag}")
          PY
          python -m build

      - name: Verify built version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import zipfile
          from pathlib import Path

          tag_version = os.environ["RELEASE_TAG"][1:]
          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one wheel, found: {wheels}")

          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata_name = next(
                  name for name in wheel.namelist()
                  if name.endswith(".dist-info/METADATA")
              )
              metadata = wheel.read(metadata_name).decode()
          built_version = re.search(
              r"^Version:\s*(.+)$", metadata, re.MULTILINE
          ).group(1).strip()

          if built_version != tag_version:
              raise SystemExit(
                  f"Version mismatch: tag={tag_version}, built package={built_version}"
              )
          print(f"Publishing GraphRicciCurvature {built_version}")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/GraphRicciCurvature
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          name: python-package
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
