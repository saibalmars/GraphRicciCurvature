[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GraphRicciCurvature"
dynamic = ["version"]
description = "Compute discrete Ricci curvatures and Ricci flow on NetworkX graphs."
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    {name = "Chien-Chun Ni", email = "saibalmars@gmail.com"},
]
license = "Apache-2.0"
dependencies = [
    "cython",
    "numpy",
    "scipy<=1.13.1",
    "networkx>=2.0",
    "pot>=0.8.0",
    "packaging",
    "networkit>=6.1",
    "python-louvain",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/saibalmars/GraphRicciCurvature"

[tool.setuptools.dynamic]
version = {attr = "GraphRicciCurvature.__version__"}

[tool.setuptools.packages.find]
include = ["GraphRicciCurvature*"]
